7","t":"igc_resolution_test.py"},{"g":"prov","p":"prov#used","s":"run27","t":"jaam_compare.py"},{"g":"prov","p":"prov#used","s":"run27","t":"param_fit.py"},{"g":"prov","p":"prov#used","s":"run27","t":"ppaz_compare.py"},{"g":"prov","p":"prov#used","s":"run27","t":"regime_compare.py"},{"g":"prov","p":"prov#used","s":"run27","t":"scale_trio.py"},{"g":"prov","p":"prov#used","s":"run27","t":"time_compare.py"},{"g":"prov","p":"prov#used","s":"run3","t":"compare.py"},{"g":"prov","p":"prov#generated","s":"run3","t":"model_comparison.csv"},{"g":"prov","p":"prov#used","s":"run4","t":"compare.py"},{"g":"prov","p":"prov#generated","s":"run4","t":"model_comparison.csv"},{"g":"prov","p":"prov#used","s":"run5","t":"compare.py"},{"g":"prov","p":"prov#generated","s":"run5","t":"model_comparison.csv"},{"g":"prov","p":"prov#used","s":"run6","t":"build_model_inputs.py"},{"g":"prov","p":"prov#generated","s":"run6","t":"dem_comparison_doc"},{"g":"prov","p":"prov#used","s":"run7","t":"compare.py"},{"g":"prov","p":"prov#generated","s":"run7","t":"model_comparison.csv"},{"g":"prov","p":"prov#generated","s":"run8","t":"eps_hypothesis.csv"},{"g":"prov","p":"prov#used","s":"run8","t":"eps_hypothesis.py"},{"g":"prov","p":"prov#used","s":"run9","t":"censo_compare.py"},{"g":"prov","p":"prov#generated","s":"run9","t":"censo_comparison.csv"}],"nodes":[{"desc":"","entry":null,"id":"ascent_error_lit","kind":"artifact","text":"ascent-error-literature.md"},{"desc":"demoted — median-point comparison unsupported by the paired test","entry":null,"id":"assert-beats","kind":"claim","text":"(superseded) The champion closed form beats the forward simulation on the 44 longões (median 3.5% vs 5.2%)."},{"desc":"methods reference for all later runs","entry":1,"id":"assert1","kind":"claim","text":"The comparison is pinned: 44 of 52 catalogued rides have measured power and a track; the ground truth is raw Σ power·dt (coasting zeros included), matching the sheet's Work Bike column to ~0.3% median; both engines read the same per-ride constants from the rider's own sheet — nothing refit."},{"desc":"hypothesis refuted — São Paulo's ε is a constant","entry":10,"id":"assert10","kind":"claim","text":"Refuted: no stop-go/braking predictor explains the per-ride gap (R² ≤ 0.07, two wrong-signed; the mechanistic correction over-corrects, RMS 0.19 vs flat-constant 0.08). Braking is invisible to ε because gravity re-supplies the braked-away speed on a descent — so ε ≈ 0.20 as a constant, and the rural −0.13 offset transfers to São Paulo essentially unchanged."},{"desc":"","entry":10,"id":"assert10_ev1","kind":"evidence","text":"Contradicts hyp10 on 59 clean censo rides: best predictor R² 0.14 is v_f itself, not any braking/stop measure; Δε_brake median 0.34 ≫ the actual gap 0.15."},{"desc":"numbers in Entries 7–10 are the corrected re-run values; Entries 2–6 left as historical record","entry":11,"id":"assert11","kind":"claim","text":"A 13-agent adversarially-verified review fixed a latent KE-floor bug (unreachable by any benchmark ride), the measuredFlatSpeed/epsFromBalance VSTOP gate (the one fix with real effect: censo ε_true 0.14 → 0.23), compressed-timestamp FIT decoding, signed drag in flatEqSpeed, and the app's interleaved-record loader; no published headline conclusion reversed. Methodological correction: the ε correlations (0.83/0.87) are part–whole — the honest statistic is RMS skill vs a flat baseline."},{"desc":"","entry":12,"id":"assert12","kind":"claim","text":"The frozen rider-1 estimator survives the transfer: ε_coast − 0.13 beats even P. Paz's own best flat constant by ~34% (RMS 0.096 vs 0.145 at s̄ ≥ 3%, n = 161); the −0.13 offset reproduces independently (measured gap 0.12); the energy law lands ~5–7% median with only mass data-implied (per-ride median m̂ 74.5 kg), and ε_geom is the best variant (+0.6% bias) on this open, coastable corpus."},{"desc":"a calibrated split, mirroring the energy-ε story: ascent transfers, descent bridge does not","entry":13,"id":"assert13","kind":"claim","text":"The ascent half is empirically supported and transfers out-of-sample: the pre-declared endpoint T1b reaches 6.6% median vs the naive baseline's 7.6% on 441 P. Paz rides (sign test p = 0.011), concentrated on the hilliest tercile, and the physics k₊ beats a FITTED ceiling frozen on the new rider (6.6 vs 10.9). The descent bridge is NOT confirmed: the analytic ε↔k₋ form systematically over-predicts measured descent speed (corr 0.08–0.59) — real descents are behaviour- and cap-limited — so k₋ stays a free, corpus-dependent coefficient."},{"desc":"","entry":13,"id":"assert13_ev1","kind":"evidence","text":"T1b 6.6% vs T0 7.6% (sign p = 0.011, Wilcoxon p < 0.001), mass-robust; hilliest tercile 12.0% → 5.8% while the flattest is unchanged."},{"desc":"","entry":13,"id":"assert13_ev2","kind":"evidence","text":"Predicted descent speeds over-shoot measured (med 38 vs 30, 37 vs 16, 52 vs 32 km/h across the three corpora); the uncapped analytic form diverges near α = ε·β·s̄. Also corrected: the stable r₊ ≈ 1.26 is a near-tautology (the Entry-7 energy over-charge re-expressed), not independent time evidence."},{"desc":"the energy law and the −0.13 offset transfer; the geometric-ε skill is rider-dependent","entry":14,"id":"assert14","kind":"claim","text":"The energy law and the −0.13 offset are consistent a third time (canonical 5.4% med|Δ%| with data-implied mass; smooth ε=0.20 best at 3.5%; offset 0.133, bootstrap CI 0.102–0.186) — but the geometric-ε skill does NOT transfer: it fails outright on JAAM's gentle-heavy bulk and is inconclusive on the thin real-descent subset. The skill works for riders who coast (P. Paz), not for riders who pedal descents (JAAM). Framing corrected: P. Paz and JAAM are independent third-party riders, not Pedal Hidrográfico members; only the censo is a collective corpus."},{"desc":"","entry":14,"id":"assert14_ev1","kind":"evidence","text":"Offset gap 0.133 [0.102, 0.186] matches the calibrated 0.13 and P. Paz's 0.12; energy 3.5–5.4% median on 219 clean rides."},{"desc":"","entry":14,"id":"assert14_ev2","kind":"evidence","text":"Frozen estimator RMS 0.47 vs flat-constant 0.16 on the gentle bulk; on real descents (n = 21) −0.020 RMS difference with CI [−0.072, 0.024] straddling zero — inconclusive."},{"desc":"","entry":15,"id":"assert15","kind":"claim","text":"All four parameters are recoverable within the pre-stated plausible ranges for all three riders: mass from braking-free sustained climbs is CdA-robust (JAAM's implied 103 kg was genuine — rider-confirmed ≈ 100 ± 7 kg, retiring Entry 14's CdA-misspecification guess); CdA and C_rr become identifiable only once per-activity wind is modelled via a LINEARISED aero regression (flat-power, coast-down and climb-only methods all fail for CdA); the wind vector itself comes from GPS-bearing directional asymmetry, de-biased for regression attenuation."},{"desc":"","entry":15,"id":"assert15_ev1","kind":"evidence","text":"P. Paz 80.9 kg / CdA 0.260 / C_rr 0.0053; JAAM 103 / 0.323 / 0.0108; author anchor 79.9 / 0.336 / 0.0082 — all inside target ranges; a synthetic-wind self-test exposed and then passed the CdA↔wind degeneracy."},{"desc":"accuracy robust; the P. Paz 35% ε win demoted to a tie; mass machinery validated","entry":16,"id":"assert16","kind":"claim","text":"The energy law's ~4–7% accuracy is robust to assumed-vs-fitted physics, but P. Paz's 35% ε win does not survive: under best-guess physics both independent riders TIE the geometric estimator against their own best flat constant (JAAM fully robust throughout). The author's full export validates the mass machinery (71–75 kg vs known ≈ 73; the earlier 79.9 was genuine brevet loadout) and the 0.13 offset, in-sample. Fitted CdA clusters at the aero-position value (0.26–0.34), ~35% below the assumed 0.40 — the flat-fit sees the tucked/drafting rider."},{"desc":"","entry":16,"id":"assert16_ev1","kind":"evidence","text":"621 clean rides: canonical 6.1% median at +0.0% bias (the calibration rider, as expected); implied mass 74.7 kg [67.7–81.0]; offset gap 0.13 recurs."},{"desc":"","entry":16,"id":"assert16_ev2","kind":"evidence","text":"With fitted physics P. Paz's frozen-ε RMS advantage collapses 0.091-vs-0.139 → 0.082-vs-0.086 (tie), and the canonical bias flips +5.0 → −6.9%."},{"desc":"rejected alternative","entry":17,"id":"assert17","kind":"claim","text":"Regime decomposition does not beat the champion: its win/loss pattern is a bias trade (a variant wins exactly where the champion's parameter bias points the other way), shown causally by the fitted-physics rerun."},{"desc":"","entry":18,"id":"assert18a","kind":"claim","text":"v2Edge's trailing max(0,·) descent clamp is dead code: ε(s) keeps every descent edge cost at or above a strictly positive floor."},{"desc":"","entry":18,"id":"assert18a_ev1","kind":"evidence","text":"1.78M-combo synthetic sweep: global min pre-clamp cost +4.1e-4 kJ; middle-regime identity to 1e-12."},{"desc":"","entry":18,"id":"assert18a_ev2","kind":"evidence","text":"Real data: min pre-clamp descent edge +4.6 J across 1402 rides (fitted physics: +3.9 J)."},{"desc":"the Jensen more-credit prediction failed; the resolution effect dominates","entry":18,"id":"assert18b","kind":"claim","text":"Grade-local ε is resolution-sensitive in a way the aggregate is not: R1d (deployed v2Edge) roughly ties the champion at ~30 m sampling and is strictly worse at 5 m."},{"desc":"","entry":19,"id":"assert19","kind":"claim","text":"The resolution over-charge transfers to the deployment: paired signed gap +9.41 pp (censo) and +3.64 pp (pooled riders) — the pre-registered decision rule is TRIGGERED."},{"desc":"","entry":19,"id":"assert19_ev1","kind":"evidence","text":"Both mechanisms measured separately: h₊(igc5) > h₊(igc30) on 919/922 rides; implied drop-weighted ε 0.414@5m vs 0.456@30m."},{"desc":"","entry":19,"id":"assert19b","kind":"claim","text":"FABDEM is unsuitable for energy computation on flat/urban terrain: pooled med|Δ%| 17.6 vs 7.1 (igc30); median h₊ +57% pooled, up to +135% on flat corpora."},{"desc":"","entry":2,"id":"assert2","kind":"claim","text":"Baseline: the canonical forward simulation reproduces measured energy to 5.1% median with no bias; the approximate (climb-aero off) sits +19.2% high on essentially every ride — the uphill aero over-charge isolated as the dominant closed-form error."},{"desc":"","entry":20,"id":"assert20","kind":"claim","text":"PASS: σ* = 10 m + per-rider effective (CdA, Crr, kSmooth) meets med|Δ%| < 5 and |bias| < 2 on all three riders' validation halves; the calibration, not the smoothing, is the lever; fitted values are effective, not physical."},{"desc":"","entry":20,"id":"assert20_ev1","kind":"evidence","text":"Validation: ppaz 3.69/+0.97, jaam 2.79/+0.12, danlessa 4.92/+0.83 (0.08 pp margin)."},{"desc":"","entry":20,"id":"assert20_ev2","kind":"evidence","text":"Ablation: σ=0 calibrated also passes (3.67/2.26/4.95) — post-calibration, smoothing buys ≈ nothing."},{"desc":"H21 partially supported — scope-limited to the terrain regime it was fitted on","entry":21,"id":"assert21","kind":"claim","text":"The behavioural constants are functions of (Δx, terrain-roughness regime), not of Δx alone: the fitted trio (k_s 0.9375, ε₀ 0.0632, climbThr 0.025) bridges the gap per-ride on all three rider corpora but closes only ~55% of censo's gap."},{"desc":"","entry":21,"id":"assert21_ev1","kind":"evidence","text":"E1 bridged on ppaz/jaam/danlessa (Δ ≤ 0.62 / ≤ 1.01 pp); P1, P2, P4 hold — k_s-only fit (0.8844) lands on the median h₊ ratio (0.8958)."},{"desc":"","entry":21,"id":"assert21_ev2","kind":"evidence","text":"P3 fails: censo (never fitted, flattest terrain) not bridged (gap 4.45 pp); E2 gate fails on danlessa by 0.22 pp."},{"desc":"","entry":22,"id":"assert22","kind":"claim","text":"Champion vs canonical is statistical parity: bootstrap 95% CIs [2.0, 5.6] vs [3.8, 7.3] overlap; paired, the champion is closer on 24/44 rides (55%, sign test p = 0.65). Parity is still practically decisive — the closed form is the engine cheap enough to route with."},{"desc":"yes — one-sided bias confirmed; three mitigations shipped as simujaules v57 options","entry":23,"id":"assert23","kind":"claim","text":"Yes — and terrain roughly doubles the pure-geometry prediction: sq8 sits +12.7% median (+47% p90) above a converged near-continuum reference on the deployed 5 m DTM; the mechanism is height oscillation under the asymmetric climb/descent cost, not octile distance. Profile-integrated sq16 recovers ≈⅔ of the bias; NAIVE long-edge costing flips the error's sign (the trap: it flattens the relief it crosses). Pre-registration scorecard against the shipped worker: wall-time confirmed, field-median borderline, budget-reach miscalibrated — pre-register distributions, not point ranges."},{"desc":"","entry":24,"id":"assert24","kind":"claim","text":"The survey brackets our measurements: consumer-baro h₊ error is ~1–5% device-level, DEM per-point accuracy does NOT transfer to accumulated ascent, and the consensus direction is GPS-only under-reads while DEM correction over-reads — Entries 6 and 19 sit inside every located band, and Entry 19's flat-terrain FABDEM failure is sharper than anything located. The decidability point: h₊ has no true value, only a value at a smoothing scale, so geometry alone cannot adjudicate between sources — the measured-energy endpoint turns the smoothing scale into a fittable parameter (Entries 19–21), a validation no located study performs."},{"desc":"P1/P3/P4 confirmed under the app's defaults; P2 refuted; the decision rule has no bundle-free answer","entry":26,"id":"assert26a","kind":"claim","text":"The grid-connectivity bias survives the move from synthetic rings to real ride endpoints: under the app's default physics the 8-direction optimum sits 11.90% above the sq128 near-continuum reference (5.99/2.38/0.73% at 16/32/64), monotone on 86/86 pairs, with no lattice direction signature once corpus imbalance is removed (12.35 pp spread → 3.35 pp). But sq16 recovers only 49.69% of the gap [CI 45.9, 53.8], so the pre-registered ≥50% decision rule FAILS by 0.31 pp — while its CI straddles the threshold and the per-pair estimator reads 51.57%, which would pass."},{"desc":"the ladder verdict is a function of the rider's cost bundle, not of the grid alone","entry":26,"id":"assert26b","kind":"claim","text":"The grid bias scales with climb-dominance β/(aRoll+aAero), measuring what Entry 25 §7 asserted but never swept: halving the ratio (53.5:1 → 28.5:1 by swapping the app defaults for an Entry-20 calibrated rider set) nearly halves the sq8 gap (11.90% → 6.82%) and lifts sq16's recovery to 57.72%. Each declared bundle therefore CONFIRMS the prediction the other REFUTES — P1 holds on bundle 1 and fails low on bundle 2, P2 the reverse — and the pre-registered 'ship 16 directions?' rule flips from FAIL to PASS. A second, corpus-independent qualification: the gap shrinks with route length (15.79% on the shortest third of pairs vs 10.25% on the longest), which explains the apparent per-rider spread."},{"desc":"P5 confirmed on 9/10 strata, P6 confirmed, P7 refuted (junction-step artifact)","entry":26,"id":"assert26c","kind":"claim","text":"Portal-correcting the PROFILE moves measured-energy accuracy and bias in the right direction wherever viaducts exist: v2Edge@igc5 med|Δ%| 22.13 → 18.32 on the urban censo rides, 14.79 → 13.21 on the author's corpus, 10.24 → 9.35 pooled over 922 rides, with |bias| shrinking on 9 of 10 corpus × model strata (the exception is JAAM under the champion R0, whose already-negative bias moves 0.18 pp further negative)."},{"desc":"","entry":26,"id":"assert26c_ev1","kind":"evidence","text":"P7 REFUTED with a mechanism: h₊ drops on 697/915 touched rides (76.2%), not ≥90% — censo 96.4% (median 20.1 m removed) but JAAM only 49.2% (median −0.1 m, ascent sometimes ADDED), and the ascent-rose group has shorter spans and less relief removed (1079 m / 2.3 m vs 1415 m / 16.3 m). Cause: junction steps where a deck endpoint sampled at the OSM abutment meets the 5 m profile grid. The artifact belongs to transplanting the portal model into a PROFILE; the deployed portal is a single Dijkstra edge with no junctions."},{"desc":"P8 and P10 confirmed; P9 not evaluated; reach is the sensitive endpoint","entry":26,"id":"assert26d","kind":"claim","text":"In the discretized scenario portals leave the median optimal route identically unchanged (ΔE median 0.000 kJ — most optimal paths never need a bridge) with a large tail (down to −7.07% at 8 directions, −8.95% at 16; 33% of pairs improved), and the gains are broadly nDirs-independent. The sensitive endpoint is AREA: portals expand budget-reachable area on 79 of 86 pairs (+0.49% median at 8 directions, +0.64% at 16), so for accessibility KPIs portals matter more as an area correction than a per-route one. Portal benefit is itself bundle-dependent (33% → 21% of pairs improved under the calibrated set), for the same β reason as the ladder."},{"desc":"secondary endpoint, uninformative as specified; interpretable only on genuine journeys","entry":26,"id":"assert26e","kind":"claim","text":"The pre-registered detour ratio E_opt/E_trackwalk is swamped by a corpus artifact: after the 800 m endpoint floor the surviving pairs are mostly near-loops (median route detour 12.4×, P. Paz 24.8×), so the pooled ratio of 0.070 measures 'this ride was not a journey'. Restricted to genuine journeys (track ≤ 2× straight line; 21 rides over 12 pairs) it reads 0.467 at sq8 and 0.421 at sq128 — on a real A→B journey roughly half the ride's energy is street-constraint and detour rather than terrain necessity. Related corpus fact: 595 of 922 rides (65%) are loops and are dropped by the floor."},{"desc":"process lessons and disclosed deviations","entry":26,"id":"assert26f","kind":"claim","text":"Three process findings. (1) PRIVACY: the first implementation pulled OSM spans per-pair using crop bboxes derived from ride endpoints — which invert back to those endpoints, often homes — contradicting the pre-registration's whole-raster pull; an adversarial harness review caught it mid-run, the 43 affected pairs were discarded, and the pull now covers a fixed 0.1° tile grid over the whole DEM (verified a strict superset of the per-pair pulls, so no coverage was lost). (2) The 'extra edges can only help' assert had to be relaxed from exact ΔE ≤ 0 to f32-aware (the engine stores E in f32, so portals reorder relaxation; worst residual 1.9e-6 kJ, rel 7.7e-8) and now reports its worst residual instead of implying zero. (3) Entry 25 §12's lesson 'pre-register distributions, not point ranges' needs a companion: pre-register the ESTIMATOR, since the decision rule's verdict changed with an equally-valid reading of 'recovers ≥50% of the median gap'."},{"desc":"nine medians move by ≤0.2 pp in the predicted direction; every rider-transfer result is unchanged","entry":27,"id":"assert27","kind":"claim","text":"A 0.24% reduction in gravity moves the assumed-parameter corpora and leaves the fitted ones alone. Longões: champion 3.6 → 3.5, canonical 5.1 → 5.2, off 19.3 → 19.1 med|Δ%|; censo: canonical 6.5 → 6.6, smooth ε=0.15 5.0 → 4.8, while the poor-man's ε=0.20 headline holds at 3.9. Every rider-corpus result is unchanged to four figures (P. Paz 4.9/+0.6 and the frozen-ε 0.091-vs-0.139 win; JAAM 3.5/+0.4; the author 6.1), as is the ε closed form (37% RMS skill, correlations 0.30/0.60/0.77/0.82, part–whole 0.72/0.99) and the time model's endpoint (T1b 6.6 vs T0 7.6). Direction as predicted: less gravity charges less for climbing, so over-predicting variants improve and the under-predicting canonical worsens. Conservation residual unchanged at 1.77e-8; cross-language parity unchanged at 8514 comparisons ≤ 1e-9."},{"desc":"","entry":27,"id":"assert27_ev1","kind":"evidence","text":"The mechanism behind the split: where mass is INVERTED from the data it absorbs the constant, so accuracy is gravity-insensitive — implied masses rise by exactly the predicted 1/G ratio (P. Paz 74.3 → 74.5 kg, JAAM 101.7 → 101.9, the author 74.5 → 74.7). Where mass is ASSUMED (the longões' sheet parameters, the censo's generic 78 kg) there is no free parameter, so the shift lands in med|Δ%| instead. A fitted corpus is insensitive to the constant; an assumed corpus is not."},{"desc":"","entry":27,"id":"assert27_ev2","kind":"evidence","text":"The re-baseline STRENGTHENS Entry 22's parity finding: paired, the champion is now closer than the canonical simulation on 24 of 44 rides (55%, sign test p = 0.65), down from 25/44 (57%, p = 0.45) — even less separable, so the article's 'parity, not beats' wording is now conservative rather than borderline. The other four paired tests are identical."},{"desc":"","entry":27,"id":"assert27_ev3","kind":"evidence","text":"One claim weakens: the frozen rural offset ε_coast − 0.13 now scores RMS 0.09 against the in-sample flat ε = 0.20's 0.08 (both were 0.08), so 'it ties the flat constant selected in-sample on this very set' becomes 'nearly ties'. Entry 10's negative result is untouched — every braking predictor still has R² ≤ 0.14 and the mechanistic correction is still worse than a constant at 0.19."},{"desc":"","entry":27,"id":"assert27_ev4","kind":"evidence","text":"Entry 19 survives re-baselining: censo (assumed mass) moves 22.1 → 21.9 vs 12.3 → 12.1 (gap 9.44 → 9.41 pp); the pooled rider corpora (inverted mass) are unchanged (9.6 vs 7.1, gap 3.64) — mass inversion absorbs gravity exactly; both decision thresholds stay triggered."},{"desc":"","entry":27,"id":"assert27_ev5","kind":"evidence","text":"Correction: the first DEM-chain re-runs froze pre-re-baseline implied masses in code (regime_compare PHYS, time_compare PPAZ_MASS); with masses corrected to 74.5/101.9/74.7 the fitted corpora return to their published values (trio 0.9375/0.0632 exact; goal primary endpoint at 3.69/2.79/4.92) — the pre-registered absorption confirmed cleanly; the briefly-published lumpy-grid-search explanation is retracted."},{"desc":"","entry":28,"id":"assert28","kind":"claim","text":"Yes: every duplicated function was proven bit-identical (or a strict superset) against real ride data before deletion, then the fast harnesses and the full bootstrap_ci gate battery were re-run and matched. Net effect: one Python implementation of the engines/parsers (src/bicycling_energy_model/), the retired V8-exactness machinery deleted (v8math.py, ~460 lines), and the JS parity harness (analysis/parity/) retired to git history since its job — proving the Python port equals the JS it replaced — is done. The repo was also restructured (src/, research/journal/, data/inputs|results/) for cohesion; zero behavioural change."},{"desc":"","entry":29,"id":"assert29","kind":"claim","text":"A pre-registered CdA × C_rr × ρ sweep on D2–D5 maps the envelope: the medians move at the several-point scale and BOTH engines move together, so parameter error is a shared-input effect rather than a differential advantage for either. ρ and CdA enter only as the product ρ·CdA, an exact degeneracy — so the sweep identifies a product, never the factors."},{"desc":"","entry":3,"id":"assert3","kind":"claim","text":"The climb-fraction correction roughly halves the over-prediction (+19.2% → +8.5% median, better on 43/44 rides); zeroing climb aero beats charging it at v_c (8.7% vs 12.5% med|Δ%|) — climbs are slow enough that their real aero is closer to zero."},{"desc":"","entry":31,"id":"assert31","kind":"claim","text":"The calibration corpus re-run blind lands at 8.2% (F3) against the simulation's 8.4%, versus 3.5%/5.2% informed — an informed→blind shift of +4.6 pp on F3 and +3.2 on the simulation. Parity survives the protocol change; the absolute level does not. The same re-run discovered that 58 of D2's 62 rides are already in D5, which is why D2 is excluded from the headline pool."},{"desc":"","entry":33,"id":"assert33","kind":"claim","text":"Mass, C_rr and CdA inverted from each ride's own segments give 3.9% pooled median error against the simulation's 4.0% — parity again, on 1,409 rides. This is partially in-sample per ride by construction and is labelled so: it answers 'can telemetry replace judgment?', not the frozen-transfer question."},{"desc":"","entry":4,"id":"assert4","kind":"claim","text":"v_f is the second lever after climb aero: sourcing it from the measured flat speed cuts the residual +8.5% → +2.7%; the sheet's 0.60 ratio nulls the bias (−0.5%) but only by over-correcting v_f — the data's flat power is ~94% of average power, not 60%."},{"desc":"","entry":43,"id":"assert43","kind":"claim","text":"Yes, and it reaches its closest parity there: on D6's 740 clean rides from four European riders, F3 with ε_d reads 3.16% against the simulation's 3.15%. The same corpus breaks F4's scalar c while leaving the form intact — the sharpest available evidence that c belongs to the elevation source rather than to cycling. Its riders pedal descents far more than the ultra-distance specialists, confirmed physics-free from descent occupancy, which does not embarrass the deficit but explains it."},{"desc":"","entry":44,"id":"assert44","kind":"claim","text":"Descent pedalling occupancy fits a sigmoid in grade whose midpoint s50 separates the rider populations disjointly — ultra-distance specialists stop pedalling on gentler ground than seasoned amateurs. An initial 9-of-9 result was withdrawn: it scored the constant outside its own ≥3% scope and leaked the flat intensity from the ride being predicted. Rescored honestly, 7 of 9."},{"desc":"","entry":45,"id":"assert45","kind":"claim","text":"Out of sample on 513 held-out rides, the grade-inverse δ = k/s̄ with k = 0.0051 beats the frozen constant, winning 344/513 (p < 1e-4) and cutting held-out deficit error 0.067 → 0.055. Its domain is real descents only: k/s̄ exceeds 1 below s̄ ≈ 0.51%, so the form is defined for s̄ ≥ 3%. A companion flat-terrain probe was retracted mid-entry — it had selected segments on RAW ascent whose target rate sat below the corpus noise floor, making the search self-reinforcing; rebuilt on deadband-smoothed cells."},{"desc":"the rule is right; the frozen grid's sub-threshold cells are a cancellation","entry":46,"id":"assert46","kind":"claim","text":"The two parameter classes reverse the verdict: under frozen priors switching WORSENS the pooled median (5.08 → 5.62), under per-ride inverted physics it IMPROVES it (5.51 → 4.12). The bias column adjudicates — below 3%, ε_d is near-unbiased under frozen priors (+0.28) and badly biased under honest physics (−4.64), while ε_f = 0.20 is the mirror image (+5.90, +0.11). Below the threshold the coasting limit clamps, so the applied ε_d has median 0.544 against ε_f's 0.20, and that refund cancels the over-prediction of the frozen CdA = 0.40 (well above the 0.26–0.32 these riders invert to). So the rule is correct and the frozen grid's sub-threshold ε_d cells are accurate BY CANCELLATION rather than by fit."},{"desc":"","entry":46,"id":"assert46_ev1","kind":"evidence","text":"Registered prediction P3 — that unswitched, the grade-inverse form is unusable — FAILS. Unswitched it is better overall than the constant (4.83 vs 5.08), and worse only inside the sub-3% band by 0.12 pp rather than the anticipated 20–70%. That anticipated gap was a DEFICIT-space under-prediction; carried into energy it nearly vanishes."},{"desc":"","entry":47,"id":"assert47","kind":"claim","text":"Two selections on D1 ∪ D2 (48 rides at s̄ ≥ 3%), by BIC under a Laplace likelihood, under frozen priors and again under per-ride inverted physics: BOTH return the incumbent ε₀ = 0.13, with zero fitted parameters. The same contest on D3–D6 selects the grade-inverse form decisively (ΔBIC 128.8), so the disagreement is statistical power, not direction — 48 calibration rides cannot resolve what 990 evaluation rides can, and only the calibration arm is licensed to build the tables. Nothing published moved."},{"desc":"","entry":47,"id":"assert47_ev1","kind":"evidence","text":"Fitting the deficit against ENERGY does not recover it. Deficit-space refits return c = 0.134 and k = 0.0052 against the published 0.13 and 0.0051, from an independent implementation; energy-space refits return 0.044 and 0.0020, two to three times lower — a free δ buys down the law's positive bias instead of measuring descent pedalling. The physical reading of δ depends on keeping the fit in deficit space."},{"desc":"","entry":47,"id":"assert47_ev2","kind":"evidence","text":"ΔBIC's scale is not the reader's scale: on D3–D6 the grade-inverse form beats the constant by ΔBIC = 128.8 and by 0.17 pp of median error, and in one arm it wins on BIC while being WORSE on the median. BIC scores the mean absolute residual; every statistic this project publishes is a median. Under AIC (flat 2k penalty) the champion does not change, but the P_a,g margin is ΔAIC = 1.9 against the 2.0 tie threshold — the incumbent survives that arm by a tenth of a unit."},{"desc":"","entry":48,"id":"assert48","kind":"claim","text":"TOST at a registered ±1.0 pp margin, 90% CI of the difference of medians under paired stratified resampling: four equivalent, six inconclusive, none outside the margin. Both transfer pools are formally equivalent — D3+D4 [−0.90, −0.33] and D3–D5 [−0.55, −0.07] — upgrading the headline claim from a failure to reject. D1 is inconclusive at n = 44 on both protocols, as predicted. Five of six inconclusive verdicts fail on the side where the LAW BEATS the simulation (D3's CI is wholly negative), so reading 'inconclusive' as a weakness of the law is backwards."},{"desc":"","entry":48,"id":"assert48_ev1","kind":"evidence","text":"The exception cost the paper a sentence: D2 · F3's interval [−0.04, +2.18] allows the closed form being up to 2.2 pp WORSE than the simulation on urban stop-go riding, with a point estimate (+1.08) already outside the margin. That sentence had claimed parity on a non-significant sign test; it now says what the data support."},{"desc":"","entry":49,"id":"assert49","kind":"claim","text":"No on both counts. k1 > 0 is solid (0.92, 95% CI [0.46, 2.73] excludes zero, so the limit does over-credit), but the two-parameter fit is UNIDENTIFIED: the derived slope 1−k1 has CI [−1.73, +0.54], spanning inverted to substantially positive, because k1 and k2 trade off. The form is also dominated by the flat constant it nests at k1 = 1 — that has the lower BIC with half the parameters and identical held-out error — so the second parameter buys nothing. The per-rider arm (14 parameters) wins in sample and on within-rider held-out, but its fits disagree on SIGN across riders, one stays pinned to a bound, and it is the only form that pushes ε outside [0,1]. Frozen ε₀ = 0.13, keeping the geometry at full weight, has the best held-out error and bias of every form with fewer than 14 parameters."},{"desc":"","entry":49,"id":"assert49_ev1","kind":"evidence","text":"The one identified number worth keeping: on real descents under honest per-ride physics the best FLAT ε is 0.344 [0.292, 0.394] — an interval excluding the published ε_f = 0.20. No contradiction, since ε_f was selected on D2's urban stop-go riding, a different regime; but it says the flat constant is regime-specific and 0.20 should not be carried onto real descents as universal."},{"desc":"champion recipe found: cf + 2 m deadband; denoise h₊ for the approximate only","entry":5,"id":"assert5","kind":"claim","text":"The approximate's entire error is a climb story (+26.7% climb regime vs ±4% flat); ~20% of raw h₊ is sub-3 m jitter, accounting for ~93% of the climb over-prediction; a 2 m deadband takes cf to 3.4% med|Δ%| — beating the raw canonical (5.1%) — while smoothing mildly HURTS the canonical, which is nearly immune to ascent noise but sensitive to regime reclassification."},{"desc":"","entry":6,"id":"assert6","kind":"claim","text":"No single source is ground truth for ascent — they bracket it: the recorded baro under-reads (−11% raw / −21% smoothed vs the IGC 5 m DTM), the DSMs over-read (COP30 +18%, SRTM +34%), FABDEM lands +6%; nearest-neighbour sampling adds ~30 pp of staircase (use bilinear); the geometric k_DEM correction is the solid result, while the energy k_h (~0.8–0.9 estimated) stayed an open TODO."},{"desc":"","entry":7,"id":"assert7","kind":"claim","text":"On sustained climbs k_h ≈ 0.96–1: the rider pays the full mg·Δh, so there is no uniform climbing discount; sustained climbing is only 54% of total ascent — the discount lives in rollers and noise — so the right correction is the per-profile deadband, not a scalar (cross-check: cf + 2 m deadband 3.5% vs canonical 5.2% vs scalar k_smooth 5.9%)."},{"desc":"","entry":73,"id":"assert73","kind":"claim","text":"The direction-count penalty is chain-shaped: on the smoothed 5 m survey it is essentially all path-length inflation (len_ratio 1.2737 at n = 4, 1.0543 at n = 8), on raw FABDEM essentially all noise (the lattice path reads 1.417x the polyline's h+ at n = 8). eF4 — the per-edge noise deduction at each chain's MEASURED c(tau=2) pin — beats eF2 on all six DEM chains and is the best deployable cost on FABDEM (41.62 vs 48.23 med|d%|). The deadband keeps a unique share at edge grain: F3 on the raw chain beats eF2 on the sigma-30-treated map on both populations (5.67 vs 9.21; 7.01 vs 11.49) — the filter can move into the map, but not all of it. The flat-vs-geometric epsilon contest is chain-dependent: grade-local wins on smoothed chains, flat on raw FABDEM. The portal deck helps 860/883 span-touched rides at sigma 10. Two populations all-arms-complete (IGC 1,034; FABDEM 1,844); every fitted constant read from its producing CSV; c pins measured from geometry only, worst disagreement with Entry 71's rates 0.14 m/km."},{"desc":"","entry":73,"id":"assert73_ev1","kind":"evidence","text":"The quantizer's parity gates forced two fixes in the new harness (n = 1 positions from the raw geo track; full-precision sample coordinates) and exposed one in the published instrument: Entry 41's 30 m arms are evaluated after a 5 m re-gridding that clips extrema between nodes — median 3.7 m/ride (0.85% of h+) on the local survey, 15.5 m (1.48%) on FABDEM — one-signed, internally consistent within that letter, disclosed as its erratum."},{"desc":"","entry":8,"id":"assert8","kind":"claim","text":"ε is predictable from grade alone on real descents: ε ≈ min(1, (α/β)/s̄) − ε₀ (unclamped since 2026-07-28 — the old clamp01 was provably inert on every measured ride), with ε₀ ≈ 0.13 the near-constant COASTING DEFICIT — the share of the descent pure coasting would refund but the rider does not collect, through residual descent pedalling and pre-corner braking; the remaining scatter is rider behaviour, not route geometry."},{"desc":"","entry":8,"id":"assert8_ev1","kind":"evidence","text":"At s̄ ≥ 3% the calibrated estimator reaches RMS 0.08 vs a flat-median baseline 0.13 — a 37% RMS reduction (Entry 11's honest statistic); worked example RMC200 Mogi: predicted 0.47 vs measured 0.47."},{"desc":"","entry":8,"id":"assert8_ev2","kind":"evidence","text":"The flat→ε→1 intuition is reversed (gentle rides are pedalled through dips, measured ε→0), curve/off-road penalties fit with the wrong sign, and over all 44 rides the estimator loses to the flat median — restrict to real descents."},{"desc":"","entry":9,"id":"assert9","kind":"claim","text":"All three models reproduce measured energy to ~4–7% median with a generic assumed rider (poor-man's ε=0.20 best at 3.9%); ε_geom over-credits descent recovery on stop-go riding — the braking penalty the open rural rides could not isolate — giving the corpus rule: ε_geom on open coastable routes, flat ε ≈ 0.20 on urban stop-go; a physical-plausibility floor excluded 7 rides whose energy deficit is a power-channel problem, not walking."},{"desc":"","entry":null,"id":"bootstrap_ci.py","kind":"artifact","text":"bootstrap_ci.py"},{"desc":"","entry":null,"id":"build_model_inputs.py","kind":"artifact","text":"build_model_inputs.py"},{"desc":"","entry":null,"id":"cda_estimate.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/cda_estimate.py`"},{"desc":"","entry":null,"id":"cda_estimate.py","kind":"artifact","text":"cda_estimate.py"},{"desc":"","entry":null,"id":"censo_compare.py","kind":"artifact","text":"censo_compare.py"},{"desc":"","entry":null,"id":"censo_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/censo_compare.py`"},{"desc":"","entry":null,"id":"compare.py","kind":"artifact","text":"compare.py"},{"desc":"","entry":null,"id":"danlessa_compare.py","kind":"artifact","text":"danlessa_compare.py"},{"desc":"","entry":null,"id":"danlessa_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/danlessa_compare.py`"},{"desc":"","entry":null,"id":"dem_comparison_doc","kind":"artifact","text":"dem-elevation-comparison.md"},{"desc":"","entry":null,"id":"e26_detour.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/e26_detour.py`"},{"desc":"","entry":null,"id":"e26_grid.csv","kind":"artifact","text":"gitignored; regenerates via `node ../simujaules/docs/grid-e26.mjs` (bundle 1)"},{"desc":"","entry":null,"id":"e26_grid_cal.csv","kind":"artifact","text":"gitignored; regenerates via `E26_BUNDLE=cal node ../simujaules/docs/grid-e26.mjs`"},{"desc":"","entry":null,"id":"e26_pairs.py","kind":"artifact","text":"e26_pairs.py"},{"desc":"","entry":null,"id":"e26_portal_profiles.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/e26_portal_profiles.py`"},{"desc":"","entry":null,"id":"e26_portal_profiles.py","kind":"artifact","text":"e26_portal_profiles.py"},{"desc":"","entry":null,"id":"e44_scurve_fits.csv","kind":"artifact","text":"gitignored; `python3 src/harness/e44_scurve.py`"},{"desc":"","entry":null,"id":"e45_ridelevel.paper.csv","kind":"artifact","text":"gitignored; `E45_TARGET=paper python3 src/harness/e45_ridelevel.py`"},{"desc":"","entry":null,"id":"e46_switch.csv","kind":"artifact","text":"gitignored; `python3 src/harness/e46_switch.py` (second-order: reads e47_formselect.csv)"},{"desc":"","entry":null,"id":"e47_formselect.csv","kind":"artifact","text":"gitignored; `python3 src/harness/e47_formselect.py`"},{"desc":"","entry":null,"id":"e48_equiv.csv","kind":"artifact","text":"gitignored; `python3 src/harness/e48_equiv.py` (grain: comparison, not ride)"},{"desc":"","entry":null,"id":"e49_affine.csv","kind":"artifact","text":"gitignored; `python3 src/harness/e49_affine.py`"},{"desc":"","entry":18,"id":"entry18","kind":"artifact","text":"Corrects Entry 17's attribution: R1a (frozen-ε per edge) is NOT the deployed sampasimu cost."},{"desc":"","entry":25,"id":"entry25","kind":"artifact","text":"Verbatim import of the canonical simujaules grid-connectivity note (headings demoted one level). The study's claims and evidence are recorded under Entry 23 (:assert23); this entry makes the journal self-contained."},{"desc":"","entry":null,"id":"eps_hypothesis.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/eps_hypothesis.py`"},{"desc":"","entry":null,"id":"eps_hypothesis.py","kind":"artifact","text":"eps_hypothesis.py"},{"desc":"","entry":null,"id":"eps_sp.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/eps_sp_test.py`"},{"desc":"","entry":null,"id":"eps_sp_test.py","kind":"artifact","text":"eps_sp_test.py"},{"desc":"","entry":null,"id":"goal_calibration.csv","kind":"artifact","text":"gitignored; regenerates via `python3 goal_calibration.py`"},{"desc":"","entry":null,"id":"goal_calibration.py","kind":"artifact","text":"goal_calibration.py"},{"desc":"","entry":null,"id":"grid-e26.mjs","kind":"artifact","text":"grid-e26.mjs"},{"desc":"","entry":null,"id":"grid_sens_note","kind":"artifact","text":"grid-connectivity-sensitivity-2026-07-11.md"},{"desc":"","entry":21,"id":"h21","kind":"hypothesis","text":"A single rider-independent re-calibration of the behavioural trio (k_s, ε₀, climbThr) at Δx = 5 m bridges the gap, with each constant moving as its mechanism predicts."},{"desc":"","entry":10,"id":"hyp10","kind":"hypothesis","text":"Urban stop-go suppresses descent recovery below the free-coasting closed form: ε_SP = clamp(ε_coast − Δε_brake), with Δε_brake read from forced decelerations in the speed trace."},{"desc":"","entry":null,"id":"igc_resolution_test.csv","kind":"artifact","text":"gitignored; regenerates via `python3 igc_resolution_test.py`"},{"desc":"","entry":null,"id":"igc_resolution_test.py","kind":"artifact","text":"igc_resolution_test.py"},{"desc":"","entry":null,"id":"jaam_compare.py","kind":"artifact","text":"jaam_compare.py"},{"desc":"","entry":null,"id":"jaam_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/jaam_compare.py`"},{"desc":"","entry":null,"id":"journal","kind":"artifact","text":"Model comparison journal"},{"desc":"","entry":null,"id":"longoes_frozen.csv","kind":"artifact","text":"gitignored; `python3 src/harness/longoes_frozen.py` (D1 under the frozen protocol)"},{"desc":"","entry":null,"id":"model_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/compare.py` (44 longões)"},{"desc":"","entry":null,"id":"param_fit.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/param_fit.py`"},{"desc":"","entry":null,"id":"param_fit.py","kind":"artifact","text":"param_fit.py"},{"desc":"","entry":null,"id":"param_sweep.csv","kind":"artifact","text":"gitignored; `python3 src/harness/param_sweep.py` (grain: corpus × combination)"},{"desc":"","entry":null,"id":"perride_invert.csv","kind":"artifact","text":"gitignored; `python3 src/harness/perride_invert.py` (INVERT_SMOKE writes a .SMOKE file)"},{"desc":"","entry":19,"id":"plan19","kind":"plan","text":"Paired v2Edge@igc5 vs @igc30 on 922 rides; decision rule: signed-bias gap > ~3–4 pp puts static ~30 m pre-smoothing on the roadmap."},{"desc":"","entry":20,"id":"plan20","kind":"plan","text":"Deterministic 50/50 hash split per rider; lever 1 = deployable Gaussian pre-smoothing σ ∈ {0,10,15,20,30,45} selected on train; lever 2 = per-rider (CdA, Crr, kSmooth) fitted on train; validation evaluated ONCE at frozen settings; pre-declared fallback ladder."},{"desc":"","entry":21,"id":"plan21","kind":"plan","text":"Two-stage: the trio is fitted purely as a 5m→30m resolution transfer (measured energies never touched in stage 1); stage 2 evaluates accuracy once on validation; censo held out entirely as an out-of-sample transfer corpus; four coherence predictions P1–P4."},{"desc":"","entry":26,"id":"plan26","kind":"plan","text":"Declared before any run (2026-07-24). Q1: the shipped buildMoves ladder (nDirs 8–128, profile-integrated long edges, sq128 reference) on the deduplicated Entry-19 endpoint pairs (≥800 m apart), two physics bundles; primary endpoint per-pair E_opt(nDirs)/E_opt(128)−1 at 8 and 16; predictions as distributions (sq8 median in [8%,18%]; sq16 recovers 55–75%; monotone for ≥95% of pairs; no direction signature); decision rule: sq16 recommended as density/KPI default if it recovers ≥50% of the median gap at ≤3× wall time. Q2A: portal-corrected igc5/igc30 profiles (OSM spans, straight-deck interpolation) re-walked on all 922 rides, paired vs raw (predictions: bias down on touched rides; pooled median <1 pp; h₊ drops on ≥90% of touched). Q2B: endpoint pairs with vs without portals at nDirs 8/16 (assert ΔE ≤ 0; tail-dominated gains at river crossings; gains mostly nDirs-independent). Gates: no-portal byte-identity (the v19 no-op invariant), bit-identity vs the real energy-worker.js, distance identity of corrected profiles. Endpoints/coords never committed; aggregates only."},{"desc":"","entry":null,"id":"ppaz_compare.py","kind":"artifact","text":"ppaz_compare.py"},{"desc":"","entry":null,"id":"ppaz_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/ppaz_compare.py`"},{"desc":"","entry":10,"id":"q10","kind":"question","text":"Is São Paulo's ε a braking-driven quantity, predictable from stop-go density?"},{"desc":"","entry":12,"id":"q12","kind":"question","text":"Does anything transfer to a second, fully-independent rider (P. Paz, different body, meter and riding profile)?"},{"desc":"","entry":13,"id":"q13","kind":"question","text":"Does the time model t = x*/v_f, x* = x + k₊·h₊ − k₋·h₋ predict measured moving time?"},{"desc":"","entry":14,"id":"q14","kind":"question","text":"Does a third fully-independent rider (JAAM) confirm the ε transfer?"},{"desc":"","entry":15,"id":"q15","kind":"question","text":"Can CdA, C_rr, mass and per-activity wind be independently estimated from uncontrolled ride data, within plausible ranges, for every dataset?"},{"desc":"","entry":16,"id":"q16","kind":"question","text":"Do the conclusions hold under the Entry-15 FITTED rider physics — and on the author's full 1597-ride export?"},{"desc":"","entry":17,"id":"q17","kind":"question","text":"Does a regime-decomposed closed form E_flat + E_climb + E_descent beat the champion?"},{"desc":"","entry":19,"id":"q19","kind":"question","text":"Most of the time we use the IGC-SP DTM at 5 m resolution — is this a concern?"},{"desc":"","entry":2,"id":"q2","kind":"question","text":"Out of the box, how close do the two models land on the 44 longões power rides?"},{"desc":"","entry":20,"id":"q20","kind":"question","text":"Can the deployed pipeline reach prediction error < ±5% with bias < ±2%?"},{"desc":"","entry":21,"id":"q21","kind":"question","text":"Can the resolution gap be bridged through parameters on the closed form rather than editing the DEM?"},{"desc":"","entry":23,"id":"q23","kind":"question","text":"Does the 8-connected move grid make simujaules terrain mode overestimate optimal energy via route jaggedness?"},{"desc":"","entry":24,"id":"q24","kind":"question","text":"What does the literature say a cumulative-ascent measurement is worth (consumer barometers ng no rider, country, terrain, device or model-selection history?"},{"desc":"","entry":44,"id":"q44","kind":"question","text":"Is the coasting deficit generated by a grade-conditional pedalling probability, and does that probability separate riders?"},{"desc":"","entry":45,"id":"q45","kind":"question","text":"Should the deficit be a constant, or a function of the route's descent geometry?"},{"desc":"","entry":46,"id":"q46","kind":"question","text":"§3.3 recommends the dynamic estimator only above a 3% mean descent grade, and no harness enforces it. What happens when the switch is built?"},{"desc":"","entry":47,"id":"q47","kind":"question","text":"Which deficit form should the paper ship, selected the way it should have been — on the calibration corpora only?"},{"desc":"","entry":48,"id":"q48","kind":"question","text":"The parity claims rest on non-significant paired tests, which are an absence of evidence. Can they be upgraded to formal equivalence?"},{"desc":"","entry":49,"id":"q49","kind":"question","text":"Does the coasting limit itself need rescaling — δ = k1·ε_coast + k2 — and is that rescaling a rider property?"},{"desc":"","entry":5,"id":"q5","kind":"question","text":"Where does the remaining error live per regime, how much is elevation noise in h₊, and does a smoothing filter help?"},{"desc":"","entry":6,"id":"q6","kind":"question","text":"How does elevation from FABDEM/SRTM/COP30 differ from the recorded barometric track, and what is k_h for DEM-derived h₊/h₋?"},{"desc":"","entry":7,"id":"q7","kind":"question","text":"What is k_h fitted on sustained ascent sections (mean slope > 3% over > 100 m)?"},{"desc":"","entry":73,"id":"q73","kind":"question","text":"What does discretisation onto a routing lattice cost the published models — per direction count, terrain chain and portal treatment — and can a Dijkstra-deployable edge cost close the gap?"},{"desc":"","entry":8,"id":"q8","kind":"question","text":"Is there a closed form for ε from each activity's route ge V8-exactness retired as an invariant. No model, harness logic or corpus changed, so every moved number moves for exactly one reason."},{"desc":"","entry":3,"id":"run3","kind":"run","text":""},{"desc":"","entry":4,"id":"run4","kind":"run","text":""},{"desc":"","entry":5,"id":"run5","kind":"run","text":""},{"desc":"","entry":6,"id":"run6","kind":"run","text":""},{"desc":"","entry":7,"id":"run7","kind":"run","text":""},{"desc":"","entry":8,"id":"run8","kind":"run","text":""},{"desc":"","entry":9,"id":"run9","kind":"run","text":""},{"desc":"","entry":null,"id":"scale_trio.csv","kind":"artifact","text":"gitignored; regenerates via `python3 scale_trio.py`"},{"desc":"","entry":null,"id":"scale_trio.py","kind":"artifact","text":"scale_trio.py"},{"desc":"","entry":null,"id":"skc_comparison.csv","kind":"artifact","text":"gitignored; `python3 src/harness/skc_compare.py` (D6; tracks start at riders' homes)"},{"desc":"","entry":null,"id":"time_compare.py","kind":"artifact","text":"time_compare.py"},{"desc":"","entry":null,"id":"time_comparison.csv","kind":"artifact","text":"gitignored; regenerates via `python3 src/harness/time_compare.py`"},{"desc":"","entry":null,"id":"verify_v2edge_clamp.py","kind":"artifact","text":"verify_v2edge_clamp.py"}]};

/* ── model ── */
const KINDS = {
  question:  {c:"--c-question", pt:"pergunta",  shape:"ring",     r:11},
  claim:     {c:"--c-claim",    pt:"afirmação", shape:"circle",   r:12},
  hypothesis:{c:"--c-claim",    pt:"hipótese",  shape:"diamond",  r:11},
  evidence:  {c:"--c-claim",    pt:"evidência", shape:"dot",      r:6},
  run:       {c:"--c-process",  pt:"execução",  shape:"triangle", r:9},
  plan:      {c:"--c-process",  pt:"protocolo", shape:"square",   r:9},
  artifact:  {c:"--c-artifact", pt:"artefato",  shape:"rect",     r:8},
};
const EDGE_PT = {sup:"sustenta", dis:"contesta", meta:"cita (corrige/atualiza/qualifica/estende)",
  cites:"cita como evidência", about:"sobre", prov:"proveniência", ref:"referência"};

/* deterministic PRNG so the initial layout is stable */
let seed = 42;
function rand(){ seed=(seed+0x6D2B79F5)|0; let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }

const nodes = DATA.nodes.map(n => ({...n,
  x:(rand()-0.5)*900, y:(rand()-0.5)*700, vx:0, vy:0}));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const links = DATA.links.map(l => ({...l, a:byId[l.s], b:byId[l.t]}));
nodes.forEach(n => { n.deg = 0; });
links.forEach(l => { l.a.deg++; l.b.deg++; });

/* ── layered layout (default): columns = journal entries, lanes = node kind ── */
const COL = 150;
const LANES = {question:-300, hypothesis:-210, claim:-120, evidence:-20,
  run:70, plan:150};
const LANE_PT = [["perguntas",-300],["hipóteses",-210],["afirmações",-120],
  ["evidências",-20],["execuções",70],["protocolos",150],["artefatos",300]];
function layeredLayout(){
  const groups = {};
  for(const n of nodes){
    if(n.entry==null || !(n.kind in LANES)) continue;
    (groups[n.entry+"|"+n.kind] = groups[n.entry+"|"+n.kind]||[]).push(n);
  }
  for(const key in groups){
    const [e] = key.split("|");
    const arr = groups[key].sort((a,b)=>a.id<b.id?-1:1);
    arr.forEach((n,i)=>{
      n.x = (e-12.5)*COL + (i%2 ? 26 : 0);
      n.y = LANES[n.kind] + i*34 - (arr.length-1)*17;
      n.vx=n.vy=0;
    });
  }
  const rest = nodes.filter(n=>n.entry==null || !(n.kind in LANES));
  for(const n of rest){
    const nb=[];
    for(const l of links){
      if(l.a===n && l.b.entry!=null) nb.push((l.b.entry-12.5)*COL);
      if(l.b===n && l.a.entry!=null) nb.push((l.a.entry-12.5)*COL);
    }
    n._cx = nb.length ? nb.reduce((s,v)=>s+v,0)/nb.length : 0;
  }
  rest.sort((a,b)=>a._cx-b._cx || (a.id<b.id?-1:1));
  rest.forEach((n,i)=>{
    n.x = (rest.length>1 ? (i/(rest.length-1)-0.5) : 0) * 23.5*COL;
    n.y = 260 + (i%3)*75;
    n.vx=n.vy=0;
  });
}

/* ── state ── */
const active = Object.fromEntries(Object.keys(KINDS).map(k=>[k,true]));
let query = "", selected = null, hovered = null, mode = "layers";
let panX = 0, panY = 0, zoom = 1, needsDraw = true;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function visible(n){ return active[n.kind] && n; }
function matches(n){ if(!query) return true;
  return (n.id + " " + n.text + " " + n.desc).toLowerCase().includes(query); }

/* ── simulation ── */
function tick(){
  const GRAV = 0.002, REP = 1300, LINK = 0.14, LEN = 65, VCAP = 5;
  for(let i=0;i<nodes.length;i++){
    const a = nodes[i]; if(!active[a.kind]) continue;
    a.vx -= a.x*GRAV; a.vy -= a.y*GRAV;
    for(let j=i+1;j<nodes.length;j++){
      const b = nodes[j]; if(!active[b.kind]) continue;
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+150;
      const f = REP/d2;
      dx*=f; dy*=f; a.vx+=dx; a.vy+=dy; b.vx-=dx; b.vy-=dy;
    }
  }
  for(const l of links){
    if(!active[l.a.kind]||!active[l.b.kind]) continue;
    const dx=l.b.x-l.a.x, dy=l.b.y-l.a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f = LINK*(d-LEN)/d;
    l.a.vx+=dx*f; l.a.vy+=dy*f; l.b.vx-=dx*f; l.b.vy-=dy*f;
  }
  for(const n of nodes){
    if(n===dragNode) { n.vx=0; n.vy=0; continue; }
    n.vx*=0.85; n.vy*=0.85;
    const v = Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    if(v>VCAP){ n.vx*=VCAP/v; n.vy*=VCAP/v; }
    n.x+=n.vx; n.y+=n.vy;
  }
}

function fitView(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,count=0;
  for(const n of nodes){ if(!active[n.kind]) continue; count++;
    x0=Math.min(x0,n.x); y0=Math.min(y0,n.y);
    x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); }
  if(!count||!W||!H) return;
  zoom = Math.min(1.5, Math.max(0.15,
    0.88*Math.min(W/(x1-x0+120), H/(y1-y0+120))));
  panX = -zoom*(x0+x1)/2; panY = -zoom*(y0+y1)/2;
}

/* ── rendering ── */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let W=0, H=0, DPR = devicePixelRatio||1;
const graphBox = document.getElementById("graph");
function resize(){
  const r = graphBox.getBoundingClientRect();
  W=r.width; H=r.height;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  needsDraw=true;
}
new ResizeObserver(resize).observe(graphBox);

function css(v){ return getComputedStyle(document.documentElement)
  .getPropertyValue(v).trim(); }

function shapePath(shape, r){
  ctx.beginPath();
  if(shape==="circle"||shape==="dot"||shape==="ring") ctx.arc(0,0,r,0,7);
  else if(shape==="diamond"){ ctx.moveTo(0,-r*1.25); ctx.lineTo(r*1.25,0);
    ctx.lineTo(0,r*1.25); ctx.lineTo(-r*1.25,0); ctx.closePath(); }
  else if(shape==="triangle"){ ctx.moveTo(0,-r*1.25); ctx.lineTo(r*1.15,r*0.9);
    ctx.lineTo(-r*1.15,r*0.9); ctx.closePath(); }
  else if(shape==="square") ctx.rect(-r,-r,2*r,2*r);
  else ctx.rect(-r*1.2,-r*0.8,2.4*r,1.6*r);
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.translate(W/2+panX, H/2+panY); ctx.scale(zoom,zoom);
  const ink=css("--ink"), muted=css("--muted"), paper=css("--paper");
  if(mode==="layers"){
    ctx.globalAlpha=0.8; ctx.fillStyle=muted; ctx.textAlign="center";
    ctx.font=`600 ${13/zoom}px -apple-system, sans-serif`;
    for(let e=1;e<=24;e++) ctx.fillText("E"+e, (e-12.5)*COL, -370);
    ctx.textAlign="right";
    ctx.font=`${12/zoom}px -apple-system, sans-serif`;
    for(const [t,y] of LANE_PT) ctx.fillText(t, -12.4*COL, y+4);
    ctx.globalAlpha=1;
  }
  const neighbors = new Set();
  const focus = selected||hovered;
  if(focus){ neighbors.add(focus.id);
    links.forEach(l=>{ if(l.a===focus) neighbors.add(l.b.id);
      if(l.b===focus) neighbors.add(l.a.id); }); }

  for(const l of links){
    if(!active[l.a.kind]||!active[l.b.kind]) continue;
    const dim = focus && !(l.a===focus||l.b===focus);
    ctx.globalAlpha = dim ? 0.08 : (l.g==="prov"||l.g==="ref" ? 0.3 : 0.55);
    ctx.strokeStyle = muted;
    ctx.lineWidth = (l.g==="sup"||l.g==="dis" ? 1.8 : 0.9)/zoom;
    ctx.setLineDash(l.g==="dis" ? [5/zoom,4/zoom]
      : l.g==="meta" ? [2/zoom,3/zoom] : []);
    ctx.beginPath(); ctx.moveTo(l.a.x,l.a.y); ctx.lineTo(l.b.x,l.b.y);
    ctx.stroke();
    /* arrowhead */
    if(!dim && zoom>0.5 && l.g!=="ref"){
      const dx=l.b.x-l.a.x, dy=l.b.y-l.a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      const rr = KINDS[l.b.kind].r+4, px=l.b.x-dx/d*rr, py=l.b.y-dy/d*rr;
      const s=4/zoom;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px-dx/d*s*2+dy/d*s, py-dy/d*s*2-dx/d*s);
      ctx.lineTo(px-dx/d*s*2-dy/d*s, py-dy/d*s*2+dx/d*s);
      ctx.closePath(); ctx.fillStyle=muted; ctx.fill();
    }
  }
  ctx.setLineDash([]);

  for(const n of nodes){
    if(!active[n.kind]) continue;
    const k = KINDS[n.kind];
    const dimF = focus && !neighbors.has(n.id);
    const dimQ = query && !matches(n);
    ctx.globalAlpha = (dimF||dimQ) ? 0.15 : 1;
    ctx.save(); ctx.translate(n.x,n.y);
    const col = css(k.c);
    const r = k.r + Math.min(4, n.deg*0.25);
    shapePath(k.shape, r);
    if(k.shape==="ring"){ ctx.lineWidth=3; ctx.strokeStyle=col;
      ctx.fillStyle=paper; ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle=col; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle=paper; ctx.stroke(); }
    if(n===selected){ shapePath(k.shape, r+4/zoom);
      ctx.lineWidth=1.5/zoom; ctx.strokeStyle=ink; ctx.stroke(); }
    if(zoom>0.3 && (n.kind!=="evidence"||focus) && !(dimF||dimQ)){
      ctx.font = `${11/zoom}px -apple-system, sans-serif`;
      ctx.fillStyle = ink; ctx.textAlign="center";
      ctx.fillText(n.id, 0, r+13/zoom);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ── main loop ── */
let cooling = 0;
let userMovedView = false;
function frame(){
  if(mode==="force" && cooling>0){ tick(); cooling--; needsDraw=true;
    if(!userMovedView && (cooling%20===0)) fitView(); }
  if(needsDraw){ draw(); needsDraw=false; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function reheat(n){
  if(mode!=="force"){ needsDraw=true; return; }
  if(reduced){ for(let i=0;i<200;i++) tick(); needsDraw=true; return; }
  cooling = Math.max(cooling, n); needsDraw=true;
}
function setMode(m){
  mode=m; userMovedView=false;
  if(m==="layers"){ cooling=0; layeredLayout(); }
  else if(reduced){ for(let i=0;i<600;i++) tick(); }
  else cooling=600;
  fitView(); needsDraw=true;
}

/* ── interaction ── */
let dragNode=null, panning=false, lastX=0, lastY=0, moved=false;
function toWorld(ev){
  const r=canvas.getBoundingClientRect();
  return [(ev.clientX-r.left-W/2-panX)/zoom, (ev.clientY-r.top-H/2-panY)/zoom];
}
function pick(ev){
  const [x,y]=toWorld(ev);
  let best=null, bd=1e9;
  for(const n of nodes){
    if(!active[n.kind]) continue;
    const r=KINDS[n.kind].r+6, d=(n.x-x)**2+(n.y-y)**2;
    if(d<r*r && d<bd){ best=n; bd=d; }
  }
  return best;
}
canvas.addEventListener("pointerdown", ev=>{
  canvas.setPointerCapture(ev.pointerId);
  moved=false; lastX=ev.clientX; lastY=ev.clientY;
  dragNode=pick(ev); panning=!dragNode;
  canvas.style.cursor = dragNode? "grabbing":"grab";
});
canvas.addEventListener("pointermove", ev=>{
  const tip=document.getElementById("tip");
  if(dragNode){
    const [x,y]=toWorld(ev); dragNode.x=x; dragNode.y=y; moved=true;
    reheat(120); return;
  }
  if(panning && ev.buttons){
    panX+=ev.clientX-lastX; panY+=ev.clientY-lastY;
    lastX=ev.clientX; lastY=ev.clientY; moved=true; userMovedView=true;
    needsDraw=true; return;
  }
  const n=pick(ev);
  if(n!==hovered){ hovered=n; needsDraw=true; }
  if(n){
    tip.style.display="block";
    tip.style.left=Math.min(innerWidth-360, ev.clientX+14)+"px";
    tip.style.top=(ev.clientY+14)+"px";
    tip.innerHTML=`<span class="id">${n.id}</span> · ${KINDS[n.kind].pt}`+
      (n.text?`<br><span class="t">${esc(n.text.slice(0,160))}${n.text.length>160?"…":""}</span>`:"");
  } else tip.style.display="none";
});
canvas.addEventListener("pointerup", ev=>{
  if(!moved){ const n=pick(ev); select(n); }
  dragNode=null; panning=false; canvas.style.cursor="grab";
});
canvas.addEventListener("wheel", ev=>{
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY*0.0012);
  const r=canvas.getBoundingClientRect();
  const mx=ev.clientX-r.left-W/2, my=ev.clientY-r.top-H/2;
  panX = mx-(mx-panX)*f; panY = my-(my-panY)*f;
  zoom*=f; zoom=Math.min(4,Math.max(0.15,zoom)); userMovedView=true;
  needsDraw=true;
},{passive:false});

function esc(s){ const d=document.createElement("i"); d.textContent=s;
  return d.innerHTML; }

/* ── sidebar ── */
function select(n){
  selected=n; needsDraw=true;
  const side=document.getElementById("side");
  if(!n){ side.classList.remove("open"); side.innerHTML=""; return; }
  const rel=[];
  for(const l of links){
    if(l.a===n) rel.push(`→ ${EDGE_PT[l.g]} (<code>${l.p}</code>) <button class="nav" data-id="${l.b.id}">${l.b.id}</button>`);
    if(l.b===n) rel.push(`← ${EDGE_PT[l.g]} (<code>${l.p}</code>) <button class="nav" data-id="${l.a.id}">${l.a.id}</button>`);
  }
  const crate = n.entry ? `<p><a href="../packages/entry${String(n.entry).padStart(2,"0")}/ro-crate-preview.html">pacote de evidência da entrada ${n.entry}</a></p>` : "";
  side.innerHTML = `<button class="close" aria-label="Fechar">fechar ✕</button>
    <div class="kind">${KINDS[n.kind].pt}${n.entry?` · entrada ${n.entry}`:""}</div>
    <h2>${esc(n.id)}</h2>
    ${n.text?`<p>${esc(n.text)}</p>`:""}
    ${n.desc?`<p class="desc">${esc(n.desc)}</p>`:""}
    ${crate}
    <h3>Relações (${rel.length})</h3>
    <ul>${rel.map(r=>`<li>${r}</li>`).join("")}</ul>`;
  side.classList.add("open");
  side.querySelector(".close").onclick=()=>select(null);
  side.querySelectorAll("button.nav").forEach(b=>{
    b.onclick=()=>{ const m=byId[b.dataset.id]; select(m);
      panX=-m.x*zoom; panY=-m.y*zoom; needsDraw=true; };
  });
}

/* ── controls ── */
const legend=document.getElementById("legend");
for(const [k,v] of Object.entries(KINDS)){
  const lab=document.createElement("label");
  lab.innerHTML=`<input type="checkbox" checked>
    <span class="sw" style="background:var(${v.c});
    ${v.shape==="ring"?"background:transparent;border:2.5px solid var("+v.c+");":""}
    ${v.shape==="diamond"?"transform:rotate(45deg);border-radius:2px;":""}
    ${v.shape==="square"||v.shape==="rect"?"border-radius:2px;":""}
    ${v.shape==="dot"?"width:.5rem;height:.5rem;":""}"></span>${v.pt}`;
  lab.querySelector("input").addEventListener("change",ev=>{
    active[k]=ev.target.checked; reheat(200);
    if(selected&&!active[selected.kind]) select(null);
  });
  legend.appendChild(lab);
}
document.getElementById("edgeLegend").textContent =
  "arestas: sólida grossa = sustenta · tracejada = contesta · " +
  "pontilhada = corrige/atualiza/qualifica · fina = proveniência/sobre";
document.getElementById("q").addEventListener("input",ev=>{
  query=ev.target.value.trim().toLowerCase(); needsDraw=true;
});
document.querySelectorAll('#modeSwitch input').forEach(r=>{
  r.addEventListener("change",()=>setMode(r.value));
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",
  ()=>{ needsDraw=true; });
layeredLayout();
resize();
fitView();
</script>
</body>
</html>
